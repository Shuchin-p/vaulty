[versions]
agp = "8.7.2"
kotlin = "2.0.21"
coreKtx = "1.15.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.11.00"
camerax = "1.4.0"
coil = "3.0.4"
media3 = "1.5.0"
room = "2.6.1"
billing = "7.1.1"
securityCrypto = "1.1.0-alpha06"
ksp = "2.0.21-1.0.27"
navigationCompose = "2.8.4"
coroutines = "1.9.0"
work = "2.9.1"
playServicesAuth = "22.0.0"
playServicesDrive = "17.0.0"
googleApiServicesDrive = "v3-rev20261106-2.9.2"
